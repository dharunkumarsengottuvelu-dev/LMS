version: "3.9"

services:
  # ── Main LMS Application ──────────────────────────────────────────────────
  lms:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: edunexus-lms
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      # ── Supabase ──────────────────────────────────────────────────────────
      NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY}
      # ── App URL ───────────────────────────────────────────────────────────
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
      NEXT_PUBLIC_APP_NAME: ${NEXT_PUBLIC_APP_NAME:-EduNexus}
      # ── Code Execution: point to the jobe service below ───────────────────
      JOBE_URL: http://jobe:80/jobe/index.php/restapi
      JOBE_TIMEOUT: "10000"
      JOBE_DEFAULT_TIME_LIMIT: "5"
      JOBE_DEFAULT_MEMORY_LIMIT: "256"
    depends_on:
      - jobe
    networks:
      - lms-network

  # ── Jobe Code Execution Sandbox ───────────────────────────────────────────
  jobe:
    build:
      context: .
      dockerfile: Dockerfile.jobe
    container_name: edunexus-jobe
    restart: unless-stopped
    # Jobe runs on port 80 internally — do NOT expose to public internet
    environment:
      JOBE_ALLOW_ORIGINS: "http://lms:3000"
    security_opt:
      - no-new-privileges:false
    networks:
      - lms-network
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 1G

  # ── SQL Execution Environments ────────────────────────────────────────────
  postgres-sandbox:
    image: postgres:15-alpine
    container_name: edunexus-postgres
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: "jobe_pg_password"
    networks:
      - lms-network
    # Exposing only inside internal network
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 512M

  mysql-sandbox:
    image: mysql:8.0
    container_name: edunexus-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: "jobe_mysql_password"
    networks:
      - lms-network
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 512M

  mariadb-sandbox:
    image: mariadb:10.11
    container_name: edunexus-mariadb
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: "jobe_mariadb_password"
    networks:
      - lms-network
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 512M

networks:
  lms-network:
    driver: bridge
