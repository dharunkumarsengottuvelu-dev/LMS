<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Clearing session — SensiLearn LMS</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #0a0f1e;
      color: #f1f5f9;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 1rem;
    }
    .card {
      background: #111827;
      border: 1px solid #1e293b;
      border-radius: 16px;
      padding: 2.5rem 2rem;
      max-width: 420px;
      width: 100%;
      text-align: center;
    }
    .spinner {
      width: 48px; height: 48px;
      border: 3px solid #1e293b;
      border-top-color: #3b82f6;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 1.5rem;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    h1 { font-size: 1.25rem; font-weight: 600; color: #f8fafc; margin-bottom: 0.5rem; }
    p  { font-size: 0.875rem; color: #94a3b8; }
    .done { display: none; }
    .done svg { margin: 0 auto 1rem; display: block; }
    .btn {
      display: inline-block;
      margin-top: 1.5rem;
      padding: 0.75rem 2rem;
      background: #3b82f6;
      color: #fff;
      border-radius: 8px;
      font-size: 0.9rem;
      font-weight: 600;
      text-decoration: none;
      transition: background 0.2s;
    }
    .btn:hover { background: #2563eb; }
  </style>
</head>
<body>
  <div class="card">
    <div id="working">
      <div class="spinner"></div>
      <h1>Clearing session data&hellip;</h1>
      <p>Please wait a moment.</p>
    </div>
    <div class="done" id="done">
      <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="#22c55e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="10"/>
        <polyline points="9 12 11 14 15 10"/>
      </svg>
      <h1>Session cleared</h1>
      <p>All cookies have been removed. You can now log in fresh.</p>
      <a href="/login" class="btn">Go to Login</a>
    </div>
  </div>

  <script>
    (function () {
      try {
        // 1. Expire every cookie visible to this origin
        var pairs = document.cookie.split(';');
        for (var i = 0; i < pairs.length; i++) {
          var name = pairs[i].split('=')[0].trim();
          if (!name) continue;
          // Expire with every plausible path
          var paths = ['/', '/student', '/admin', '/trainer', '/institution', '/api'];
          for (var j = 0; j < paths.length; j++) {
            document.cookie = name + '=; path=' + paths[j] + '; max-age=0; expires=Thu, 01 Jan 1970 00:00:00 GMT; SameSite=Lax';
            document.cookie = name + '=; path=' + paths[j] + '; max-age=0; expires=Thu, 01 Jan 1970 00:00:00 GMT; SameSite=Lax; Secure';
          }
        }

        // 2. Clear localStorage and sessionStorage
        try { localStorage.clear(); } catch(e) {}
        try { sessionStorage.clear(); } catch(e) {}

        // 3. Show done state and redirect after 1.5s
        document.getElementById('working').style.display = 'none';
        document.getElementById('done').style.display = 'block';

        setTimeout(function () {
          window.location.replace('/login');
        }, 1500);

      } catch (err) {
        // If anything fails, just hard-redirect to login
        window.location.replace('/login');
      }
    })();
  </script>
</body>
</html>
